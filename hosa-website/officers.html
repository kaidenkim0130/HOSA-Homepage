  <footer class="footer">

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ===============================================================
       👇  EDIT YOUR OFFICERS HERE  👇
       ===============================================================
       Each officer is a block of 4 lines between { and }.
       To change someone, just edit the text between the quotes.

       FIELDS:
         name  — The officer's name shown on the card
         role  — Their position (President, VP, etc.)
         photo — Path to their picture. Examples:
                   "images/jane.jpg"   → uses that image
                   ""                  → shows their initials instead
         bio   — A short sentence about them

       TO ADD AN OFFICER: copy one whole { ... }, block (including
       the comma at the end) and paste it inside the [ ].

       TO REMOVE AN OFFICER: delete the whole { ... }, block.

       TO ADD A PHOTO:
         1. Put the photo in the "images" folder (next to this file).
         2. Set photo to something like "images/their-name.jpg".
       =============================================================== */

    const OFFICERS = [
      {
        name: "Aishwarya Sridhar",
        role: "President",
        photo: "images/aish.jpg",
        bio: "Hello, everyone! My name is Aishwarya Sridhar, and I am honored to serve as your HOSA chapter president this year. In the future, I hope to pursue a career in oncology, and I am incredibly excited to see everything our chapter will accomplish. After serving as a chapter officer for the past three years, it has been such a privilege to watch Hooch HOSA grow and become the incredible group it is today. I am also grateful to be leading such a dedicated and talented team of officers this year. I am so proud of how far our chapter has come, and I cannot wait for us to continue growing, creating new opportunities, and making meaningful memories together. Let’s make this another great year! Please feel free to reach out to me at any time."
      },
      {
        name: "Kaiden Kim",
        role: "Secretary",
        photo: "images/kaiden.jpg",
        bio: "Hey guys. I'm Kaiden and I'm a senior serving as your secretary this year. My goal is to become a cosmetic surgeon. My primary responsibilities are to take care of points and the website you're seeing this on. If you have any issues with your points email kaidenkimktk@gmail.com.  "
      },
      {
        name: "Yoshita G.",
        role: "President-Elect",
        photo: "images/yosh.jpg",
        bio: "Hello everyone! I’m Yoshita, and currently I'm a junior. I'm so excited to be your President-Elect this school year! In my future I aspire to be an anesthesiologist. I became a HOSA officer this year not just to be a good leader but to grow as a person with the wonderful community that our club offers. I can’t wait to make this year a great year and an amazing experience  for every single one of you!"
      },
      {
        name: "Lucía Leal",
        role: "Vice President of Membership",
        photo: "images/lucia.jpg",
        bio: "Hello, everyone! I’m Lucía, and I’m currently a junior serving as your Vice President of Membership this year. I am interested in neuroscience and women’s health, and in the future I plan to become a neurologist. I am super proud to be a member and new officer because HOSA has given me so many opportunities. I am always excited to work with new people, so do not be afraid to reach out!"
      },
      {
        name: "Noah Sheftel",
        role: "Vice President of Community Relations",
        photo: "images/noah.jpg",
        bio: "Hi everyone! I’m Noah Sheftel, a junior, and I’m honored to be serving as your Vice President of Community Relations. I hope to pursue a career as a forensic psychiatrist, where I can combine my interests in psychology, medicine, and criminal justice while helping others. I became a HOSA officer because HOSA has given me the opportunity to connect with others who share my interests in healthcare, and I wanted to give back by supporting our members, building new connections, and helping make our chapter a great experience for everyone. I’m so excited for this year and can’t wait to work with everyone!"
      },
      {
        name: "Aditi Jadhav",
        role: "Treasurer",
        photo: "images/aditi.jpg",
        bio: "Hey guys! I’m Aditi Jadhav, a senior, and serving as your treasurer! I aspire to work in the pediatric field of healthcare. Outside of school, I love to watch movies and paint!"
      },
      {
        name: "Abby Cheng",
        role: "Historian",
        photo: "images/abby.jpg",
        bio: "Hello, I’m Abby Cheng!I’m a Junior serving as your Historian. I hope to enter the field of medicine as a physician assistant specializing in dermatology. A hobby of mine is dancing ballet."
      },
      {
        name: "Ivanka Kathuria",
        role: "Parliamentarian",
        photo: "images/ivanka.jpg",
        bio: "Hi everyone! I’m Ivanka, I’m a junior, and I am so excited to serve as your parliamentarian this school year! My professional healthcare goals include becoming a speech-language pathologist with a focus on stuttering research in children, and eventually going on to get my doctorate to teach at a university! I wanted to become a HOSA officer because of my long-term interest in the field of healthcare, and I would love to pay it forward to the underclassmen at Hooch. I can’t wait to work with you all."
      },
      {
        name: "Seojun Choi",
        role: "Chair of Engagement",
        photo: "images/seojun.jpg",
        bio: "Answer"
      },
    ];

    /* ===============================================================
       Nothing below this line needs to be edited.
       =============================================================== */

    function getInitials(name) {
      return name
        .split(/\s+/)
        .filter(Boolean)
        .map(w => w[0])
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
      );
    }

    function renderOfficers() {
      const grid = document.getElementById('officersGrid');

      if (!OFFICERS.length) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--navy-soft);">No officers added yet.</p>';
        return;
      }

      grid.innerHTML = OFFICERS.map(o => {
        const hasPhoto = o.photo && o.photo.trim();
        const photoStyle = hasPhoto
          ? `style="background-image: url('${escapeHtml(o.photo)}')"`
          : '';
        const photoInner = hasPhoto ? '' : escapeHtml(getInitials(o.name));

        return `
          <div class="officer-card">
            <div class="officer-photo" ${photoStyle}>${photoInner}</div>
            <div class="officer-info">
              <span class="officer-role">${escapeHtml(o.role)}</span>
              <div class="officer-name">${escapeHtml(o.name)}</div>
              <p class="officer-bio">${escapeHtml(o.bio)}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    renderOfficers();
  </script>
</body>
</html>
